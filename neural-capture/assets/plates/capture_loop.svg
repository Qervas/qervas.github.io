<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 360" font-family="DM Sans, system-ui, sans-serif">
  <rect width="980" height="360" fill="#0d1016"/>
  <text x="40" y="34" fill="#c9a27a" font-size="12" letter-spacing="3">PER-POSITION LOOP · AUTOMATEDCAPTURECONTROLLER</text>
  <!-- boxes horizontal -->
  <g font-size="13">
    <rect x="30" y="80" width="150" height="70" rx="4" fill="#171b24" stroke="#c9a27a"/>
    <text x="105" y="112" text-anchor="middle" fill="#c9a27a" font-size="11">1 · MOVE</text>
    <text x="105" y="132" text-anchor="middle" fill="#ebe4d6">BLE rotate/tilt</text>
    <rect x="210" y="80" width="150" height="70" rx="4" fill="#171b24" stroke="#c9a27a"/>
    <text x="285" y="112" text-anchor="middle" fill="#c9a27a" font-size="11">2 · SETTLE</text>
    <text x="285" y="132" text-anchor="middle" fill="#ebe4d6">default ~2 s</text>
    <rect x="390" y="80" width="150" height="70" rx="4" fill="#171b24" stroke="#6eb8d4"/>
    <text x="465" y="112" text-anchor="middle" fill="#6eb8d4" font-size="11">3 · CAPTURE</text>
    <text x="465" y="132" text-anchor="middle" fill="#ebe4d6">Snap+Wait all</text>
    <rect x="570" y="80" width="150" height="70" rx="4" fill="#171b24" stroke="#7dba8a"/>
    <text x="645" y="112" text-anchor="middle" fill="#7dba8a" font-size="11">4 · SAVE</text>
    <text x="645" y="132" text-anchor="middle" fill="#ebe4d6">parallel TIFF</text>
    <rect x="750" y="80" width="190" height="70" rx="4" fill="#171b24" stroke="#6eb8d4"/>
    <text x="845" y="112" text-anchor="middle" fill="#6eb8d4" font-size="11">5 · NEXT POS</text>
    <text x="845" y="132" text-anchor="middle" fill="#ebe4d6">index++ / SM Idle</text>
  </g>
  <line x1="180" y1="115" x2="210" y2="115" stroke="#6e685c" stroke-width="1.5"/>
  <line x1="360" y1="115" x2="390" y2="115" stroke="#6e685c" stroke-width="1.5"/>
  <line x1="540" y1="115" x2="570" y2="115" stroke="#6e685c" stroke-width="1.5"/>
  <line x1="720" y1="115" x2="750" y2="115" stroke="#6e685c" stroke-width="1.5"/>
  <text x="40" y="200" fill="#c9a27a" font-size="11" letter-spacing="2">CAMERA BANDWIDTH CONTRACT (CameraManager::CaptureAllCameras)</text>
  <rect x="40" y="220" width="900" height="100" rx="4" fill="#11141a" stroke="#2a3140"/>
  <text x="60" y="250" fill="#ebe4d6" font-size="13">For each group of parallel_groups cameras:</text>
  <text x="60" y="275" fill="#a39c8e" font-size="13">Phase A — sequential Snap()+Wait(5000) per camera (GigE-safe) · optional stagger_delay_ms between cams</text>
  <text x="60" y="300" fill="#a39c8e" font-size="13">Phase B — parallel SaveImageFromBuffer to session path · then group_delay_ms before next group</text>
</svg>
